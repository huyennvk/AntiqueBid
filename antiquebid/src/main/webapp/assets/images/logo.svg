<svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Imperial Gold Gradients -->
    <linearGradient id="abGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="25%" stop-color="#ecc352" />
      <stop offset="50%" stop-color="#caa035" />
      <stop offset="75%" stop-color="#936d13" />
      <stop offset="100%" stop-color="#fef3b8" />
    </linearGradient>
    <linearGradient id="abGoldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a07515" />
      <stop offset="40%" stop-color="#e8bf4b" />
      <stop offset="70%" stop-color="#ffd875" />
      <stop offset="100%" stop-color="#fffdf2" />
    </linearGradient>
    <radialGradient id="abDarkSealBg" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#302013" />
      <stop offset="65%" stop-color="#1a110a" />
      <stop offset="100%" stop-color="#0a0604" />
    </radialGradient>
    <filter id="abGoldShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#caa035" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Outer Polished Gold Rim & Dark Seal Disc -->
  <circle cx="24" cy="24" r="22.5" fill="url(#abDarkSealBg)" stroke="url(#abGoldRim)" stroke-width="2" filter="url(#abGoldShadow)" />
  
  <!-- 2. Decorative Beaded Inner Ring -->
  <circle cx="24" cy="24" r="19.5" fill="none" stroke="url(#abGoldInner)" stroke-width="0.8" stroke-dasharray="1.2 1.2" opacity="0.85" />
  <circle cx="24" cy="24" r="18" fill="none" stroke="url(#abGoldRim)" stroke-width="0.5" opacity="0.6" />

  <!-- 3. Laurel Wreath Emblems (Branches of Heritage & Authenticity) -->
  <g opacity="0.75" stroke="url(#abGoldRim)" stroke-width="0.9" fill="none">
    <!-- Left Wreath Leaf Arcs -->
    <path d="M9.5 24 C9.5 17 13.5 12 17.5 9.5" />
    <path d="M8.5 21 C10 20.5 11 19 10.5 17.5" fill="url(#abGoldInner)" />
    <path d="M10 16.5 C11.5 16 12.5 14.5 12 13" fill="url(#abGoldInner)" />
    <path d="M12.5 12.5 C14 12 15 10.5 14.5 9" fill="url(#abGoldInner)" />
    
    <!-- Right Wreath Leaf Arcs -->
    <path d="M38.5 24 C38.5 17 34.5 12 30.5 9.5" />
    <path d="M39.5 21 C38 20.5 37 19 37.5 17.5" fill="url(#abGoldInner)" />
    <path d="M38 16.5 C36.5 16 35.5 14.5 36 13" fill="url(#abGoldInner)" />
    <path d="M35.5 12.5 C34 12 33 10.5 33.5 9" fill="url(#abGoldInner)" />
  </g>

  <!-- 4. Auction Gavel (Diagonal Prestige Handle & Striker) -->
  <g id="gavel">
    <!-- Gavel Handle -->
    <line x1="14" y1="33" x2="33" y2="14" stroke="url(#abGoldRim)" stroke-width="2" stroke-linecap="round" />
    <!-- Gavel Brass Accent Ring -->
    <line x1="28.5" y1="18.5" x2="30.5" y2="16.5" stroke="#fff8db" stroke-width="2.6" stroke-linecap="round" />
    <!-- Gavel Head (Angled) -->
    <g transform="rotate(-45 33 14)">
      <rect x="30" y="10.5" width="6" height="7" rx="1.2" fill="url(#abGoldInner)" stroke="url(#abGoldRim)" stroke-width="0.7" />
      <line x1="33" y1="10.5" x2="33" y2="17.5" stroke="#fffdf2" stroke-width="0.8" opacity="0.8" />
    </g>
  </g>

  <!-- 5. Classical Antique Amphora / Vase (Center Icon) -->
  <g id="amphora">
    <!-- Base Pedestal -->
    <path d="M21 34.5 L27 34.5 L28 36.5 L20 36.5 Z" fill="url(#abGoldRim)" />
    <!-- Lower Body & Foot -->
    <path d="M22 34.5 L22 33 C22 32 21 31 19 29 C17.5 27.5 17 25 17.5 23 C18 20.5 20 18.5 21 17.5 L27 17.5 C28 18.5 30 20.5 30.5 23 C31 25 30.5 27.5 29 29 C27 31 26 32 26 33 L26 34.5 Z" 
          fill="url(#abGoldInner)" stroke="url(#abGoldRim)" stroke-width="0.8" />
    <!-- Neck & Flared Lip -->
    <path d="M21 17.5 L20.5 14.5 L27.5 14.5 L27 17.5 Z" fill="url(#abGoldRim)" />
    <ellipse cx="24" cy="14" rx="3.8" ry="1.2" fill="url(#abGoldInner)" stroke="url(#abGoldRim)" stroke-width="0.6" />
    
    <!-- Ornate Scroll Handles -->
    <path d="M19.5 17 C16.5 18 15.5 22 17.5 24 M28.5 17 C31.5 18 32.5 22 30.5 24" 
          stroke="url(#abGoldRim)" stroke-width="1.2" stroke-linecap="round" fill="none" />
          
    <!-- Decorative Center Motif (Diamond Star / Royal Emblem on Vase) -->
    <path d="M24 21.5 L25 24 L27.5 25 L25 26 L24 28.5 L23 26 L20.5 25 L23 24 Z" fill="#fffdf2" opacity="0.95" />
    <circle cx="24" cy="25" r="0.8" fill="#a07515" />
  </g>

  <!-- 6. Sparkling Star Highlight at Top Edge -->
  <path d="M24 3 L24.6 4.8 L26.5 5.5 L24.6 6.2 L24 8 L23.4 6.2 L21.5 5.5 L23.4 4.8 Z" fill="#fff8db" opacity="0.9" />
</svg>
